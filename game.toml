# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "Parasite Eve"
id = "SLUS-00662"
players = 1
exe = "disc/SLUS_006.62"
discs = [
    "disc/Parasite Eve (USA) (Disc 1).cue",
    "disc/Parasite Eve (USA) (Disc 2).cue",
]
disc_serials = [
    "SLUS-00662",
    "SLUS-00668",
]
load_address = "0x80010000"
entry_pc = "0x80072534"
text_size = "0x001EE000"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Parasite Eve (USA) (Disc 1).bin"
cue_name = "Parasite Eve (USA) (Disc 1).cue"
boot_exe = "SLUS_006.62"
known_sizes = [495531120]
known_md5 = [
  "efae1df4faf4aadbfd4dc3aa022296cf",
]
known_sha1 = [
  "c339455d5b1dae04f77c2ee847d0932adaf2e84b",
]
known_crc32 = [
  "488641e0",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# Game-function entry hooks for trusted mods (src/mods). Each address gets a
# psx_mod_function_entry() call at the top of its generated function.
#   0x8005F27C Draw_PrintRawText - pe_weapon_power.c (gun power in menu titles)
mod_function_entry_funcs = ["0x8005F27C"]

[runtime]
window_title = "Parasite Eve Recompiled"
memcard_dir = "saves"
# PE streams menus/rooms/battles/cutscenes as code overlays. Without this the
# runtime never captures/compiles them and they run on the slow interpreter.
overlay_cache = true
# Fast-forward guest idle spin-loops instead of executing every iteration.
idle_skip = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"

[controller]
default_mode = "digital"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
required_disc_fps = [
    "9913da87c9c4ecacce11878e7bb1459d0e1f7e633654f60ea5c32e30004b53b3",
    "a45f792bd8e701b3d48d9c18df2f9e205137973a399c8a9bd20f38b22647262d",
]
require_cue = true
required_tracks = 1
required_disc_fp = "9913da87c9c4ecacce11878e7bb1459d0e1f7e633654f60ea5c32e30004b53b3"
