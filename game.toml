[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# Game-function entry hooks for trusted mods (src/mods). Each address gets a
# psx_mod_function_entry() call at the top of its generated function.
#   0x8005F27C Draw_PrintRawText - pe_weapon_power.c (gun power in menu titles)
#   0x800299CC Battle_Update     - pe_atb_items.c (half-bar items)
#   Loot overhaul (bridge findings pe-loot-overhaul-design-2026-10-11.md, 6.4-6.6):
#   0x8004B70C Aya_SetTotalExp   - battle-end rewards (a0 EXP, a1 BP, a2 reward list)
#   0x8005D2B4 Inv_DispatchCommand - script inventory commands (Wayne's hand-in)
#   0x80053D2C Inv_AddItem       - chest/story pickups and steals
#   0x8003F800 Save_SerializeTail   - memory-card save (mod data in the save tail)
#   0x8003FBD8 Save_DeserializeTail - memory-card load
#   0x800194F8 Task_CountItemsByValue - script item counts (Wayne counts Junk)
#   0x8005A318 Inv_TransferItemBetweenLists - Tool use (plain-Tool donor salvage)
#   0x80023E14 Battle_ApplyDamage - battle item use (Smoke Grenade, pe_custom.c)
#   0x80052C08 Util_AppendFFTerminatedBytes - discard dialog text (pe_native_menu.c)
#   0x80045110 Menu_OnItemDiscardConfirm - Discard dismantles gear (pe_native_menu.c)
#   0x80050878 Sfx_ContextPick - item action rows (Combine row, pe_native_menu.c)
#   0x8005F354 Draw_PrintCenteredTextInWidth - Combine row label
#   0x80044B0C Menu_StepEquipScreen - item action accept (Combine)
#   0x80037870 Menu_DrawTextboxEntries - Wayne's Workshop in his choice box (pe_wayne_menu.c)
#   0x800661A4 Render_SetGteScreenOffset - right after text boxes: dim our unbuyable rows
#   0x800647D0 Draw_SetPrimCallback - Mod Catalog row in Aya's main menu (pe_catalog_menu.c)
#   0x80043DA4 Menu_StepItemSelectScreen - confirm on that row opens the Catalog
#   0x8005EB64 Draw_AllocSprite - Catalog row above Bonus Points (icon swap)
#   0x8004F950 Menu_DrawActionOptionList, 0x800509A8 Menu_DrawActionOptionRow - Catalog panels' rows
#   0x8004C608 Menu_DrawContextHelpText - Catalog descriptions in the title bar
#   0x80062CC4 MenuWidget_GetCurrentNode, 0x80052534 Battle_IsActiveWrapped - Catalog Cross (as a list's itemAction)
#   0x80050ADC Menu_DrawActionCodeItem - no portrait for economy armor mod badges
mod_function_entry_funcs = ["0x8005F27C", "0x800299CC", "0x8004B70C", "0x8005D2B4",
                            "0x80053D2C", "0x8003F800", "0x8003FBD8", "0x800194F8",
                            "0x8005A318", "0x80023E14", "0x80052C08", "0x80045110",
                            "0x80050878", "0x8005F354", "0x80044B0C", "0x80037870", "0x800661A4",
                            "0x800647D0", "0x80043DA4", "0x8005EB64",
                            "0x8004F950", "0x800509A8", "0x8004C608",
                            "0x80062CC4", "0x80052534", "0x80050ADC"]

[runtime]
window_title = "Parasite Eve Recompiled"
memcard_dir = "saves"
# PE streams menus/rooms/battles/cutscenes as code overlays. Without this the
# runtime never captures/compiles them and they run on the slow interpreter.
overlay_cache = true
# Fast-forward guest idle spin-loops instead of executing every iteration.
idle_skip = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"

[controller]
default_mode = "digital"

# Online mount gate: digests + track count + optional TOC fingerprint
