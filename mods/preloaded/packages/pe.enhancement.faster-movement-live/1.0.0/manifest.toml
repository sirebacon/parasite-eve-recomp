format_version = 5
id = "pe.enhancement.faster-movement-live"
version = "1.0.0"
name = "Faster Field Movement (retired)"
author = "pe-mods"
description = "Retired: does nothing. This package used to patch Entity_ComputeVelocity (0x800185C0, lui $a0 5 -> 20), chosen before the decomp was available. The decomp shows that function is a scripted-motion opcode, not Aya's player movement, and a live measurement confirmed her walk and run speeds were unchanged with it on. Aya's run speed is now the 'Run speed' setting in the in-game F1 menu (Mods > PE Enhancements), which scales Aya's movement factor while she runs (the run handler in Scene_PlayerMovement reads it every frame; patching its code does not reach the statically recompiled EXE). Its patch has been removed, so leaving this enabled is harmless."

[[target]]
game_id = "SLUS-00662"

[[feature]]
id = "faster-movement"
name = "Faster Field Movement (retired, no effect)"
description = "Retired. Use 'Run speed' in the F1 menu (Mods > PE Enhancements) instead."
group = "Quality of Life"
default_enabled = false
