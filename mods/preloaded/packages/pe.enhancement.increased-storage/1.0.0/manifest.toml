id = "pe.enhancement.increased-storage"
version = "1.0.0"
name = "Increased Inventory Storage (retired)"
author = "pe-mods"
description = "RETIRED and parked (2026-10-10). The 80-slot inventory clamps that were baked into the disc-extracted boot EXE never reached the running game, which keeps the retail 50-slot limits; the boot EXE was restored to retail on 2026-10-10. Raising the clamp could never have worked safely: the inventory is a fixed 50-entry array that ends where Aya's equipment records begin and is part of the memory-card save layout, so extra slots would overwrite equipment data. Any revival needs a separate side store outside the save structures. This package declares no [[feature]] or [[patch]]."

[[target]]
game_id = "SLUS-00662"
