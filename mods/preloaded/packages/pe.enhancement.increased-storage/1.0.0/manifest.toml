format_version = 5
id = "pe.enhancement.increased-storage"
version = "1.0.0"
name = "Increased Inventory Storage (retired)"
author = "pe-mods"
description = "RETIRED as a toggleable mod (2026-09-13), following the same root-cause fix applied to pe.enhancement.faster-movement. The storage/inventory clamp values are now baked directly into the shipped SLUS-00662 executable unconditionally rather than applied via a runtime RAM patch. This package intentionally declares no [[feature]]/[[patch]] -- a live [[patch]] here would write its old clamp encodings into guest RAM at boot/savestate-load, forcing those instructions into interpreter fallback and making the game execute the STALE RAM value instead of the correct value compiled into the EXE (this is exactly what was found happening to the movement mod: mem_words showed a stale RAM-patched value even on a freshly rebuilt binary with the correct value baked in). Do not re-add [[patch]] entries here unless the EXE-level fix is reverted first."

[[target]]
game_id = "SLUS-00662"
