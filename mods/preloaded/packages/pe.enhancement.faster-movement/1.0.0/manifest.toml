format_version = 5
id = "pe.enhancement.faster-movement"
version = "1.0.0"
name = "Faster Field Movement (retired)"
author = "pe-mods"
description = "RETIRED, superseded by pe.enhancement.faster-movement-live. An earlier approach baked the 20x multiplier into the disc-extracted boot EXE; it never reached the running game (the runtime loads retail code from the real disc image) and only made the generated code disagree with live memory. The boot EXE was restored to the retail bytes on 2026-10-10. This package declares no [[feature]] or [[patch]] and is kept only as a historical record. Use faster-movement-live, a live [[patch]] checked against the retail bytes."

[[target]]
game_id = "SLUS-00662"
